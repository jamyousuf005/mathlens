<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#FDFBF7; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E231D" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="80" y="70" font-size="34" font-weight="700" fill="#1E231D">MathLens Mathematical Domains &amp; Capabilities</text>
  <text x="80" y="105" font-size="16" font-weight="400" fill="#5F675D">Complete taxonomy of mathematical problem types recognized, compiled, solved, and verified by our system</text>

  <!-- GRID: 2 Rows x 3 Columns -->

  <!-- CARD 1: Quadratic Equations -->
  <g transform="translate(80, 150)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Quadratic Equations</text>
    <rect x="24" y="58" width="145" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">Quadratic Equation</text>
    <rect x="180" y="58" width="185" height="24" rx="6" fill="#EEF2F8"/>
    <text x="188" y="74" font-size="11" font-weight="700" fill="#2C579B">Exact CAS + Discriminant</text>
    <text x="24" y="112" font-size="13" fill="#5F675D" width="500">
      <tspan x="24" dy="0">Solves second-degree polynomial equations. Computes discriminant</tspan>
      <tspan x="24" dy="20">Δ = b² - 4ac, distinct real roots, repeated double roots, and complex</tspan>
      <tspan x="24" dy="20">conjugate roots (a ± bi). Automatically verifies residual norm.</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">x^2 - 8x + 15 = 0  ⟶  x = 3, x = 5</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">x^2 + 4x + 13 = 0  ⟶  x = -2 ± 3i</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">x^2 - 12x + 36 = 0  ⟶  x = 6 (Double Root)</text>
  </g>

  <!-- CARD 2: Linear Equations -->
  <g transform="translate(685, 150)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Linear Equations (Single Variable)</text>
    <rect x="24" y="58" width="115" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">Linear Equation</text>
    <rect x="150" y="58" width="165" height="24" rx="6" fill="#EEF2F8"/>
    <text x="158" y="74" font-size="11" font-weight="700" fill="#2C579B">Symbolic Term Reducer</text>
    <text x="24" y="112" font-size="13" fill="#5F675D">
      <tspan x="24" dy="0">Isolates unknown variable x by expanding distributed parentheses,</tspan>
      <tspan x="24" dy="20">combining like terms, transferring constants to the opposite side,</tspan>
      <tspan x="24" dy="20">and dividing by the leading coefficient in sequential steps.</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">5x - 14 = 2x + 16  ⟶  x = 10</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">4(2x - 3) = 3(x + 6)  ⟶  x = 6</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">2(x + 5) - 3 = 19  ⟶  x = 6</text>
  </g>

  <!-- CARD 3: Systems of Linear Equations -->
  <g transform="translate(1290, 150)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Systems of Linear Equations</text>
    <rect x="24" y="58" width="180" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">System of Linear Equations</text>
    <rect x="215" y="58" width="180" height="24" rx="6" fill="#EEF2F8"/>
    <text x="223" y="74" font-size="11" font-weight="700" fill="#2C579B">Cramer's Rule / 2x2 Matrix</text>
    <text x="24" y="112" font-size="13" fill="#5F675D">
      <tspan x="24" dy="0">Solves simultaneous 2-variable systems using determinants</tspan>
      <tspan x="24" dy="20">(Dx, Dy / D). Accurately distinguishes unique solutions, inconsistent</tspan>
      <tspan x="24" dy="20">parallel systems (no solution), and dependent infinite lines.</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">3x + 4y = 25, 2x - 3y = -6  ⟶  x = 3, y = 4</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">2x + 4y = 10, x + 2y = 8  ⟶  No solution</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">3x - 6y = 9, x - 2y = 3  ⟶  Infinite solutions</text>
  </g>

  <!-- CARD 4: Algebraic Identities & Factoring -->
  <g transform="translate(80, 580)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Algebraic Identities &amp; Factoring</text>
    <rect x="24" y="58" width="190" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">Algebraic Identity / Factoring</text>
    <rect x="225" y="58" width="175" height="24" rx="6" fill="#EEF2F8"/>
    <text x="233" y="74" font-size="11" font-weight="700" fill="#2C579B">Polynomial Identity Parser</text>
    <text x="24" y="112" font-size="13" fill="#5F675D">
      <tspan x="24" dy="0">Detects canonical binomial and trinomial forms to factor expressions:</tspan>
      <tspan x="24" dy="20">Difference of Squares (a² - b²), Difference of Cubes (a³ - b³),</tspan>
      <tspan x="24" dy="20">Sum of Cubes (a³ + b³), and Perfect Square Trinomials.</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">a^2 - b^2  ⟶  (a - b)(a + b)</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">a^3 - b^3  ⟶  (a - b)(a^2 + ab + b^2)</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">8x^3 - 27  ⟶  (2x - 3)(4x^2 + 6x + 9)</text>
  </g>

  <!-- CARD 5: Calculus (Derivatives & Integrals) -->
  <g transform="translate(685, 580)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Calculus: Derivatives &amp; Integrals</text>
    <rect x="24" y="58" width="175" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">Differentiation / Integration</text>
    <rect x="210" y="58" width="195" height="24" rx="6" fill="#EEF2F8"/>
    <text x="218" y="74" font-size="11" font-weight="700" fill="#2C579B">Symbolic CAS Bridge (Nerdamer)</text>
    <text x="24" y="112" font-size="13" fill="#5F675D">
      <tspan x="24" dy="0">Executes analytical calculus. Calculates symbolic derivatives with</tspan>
      <tspan x="24" dy="20">power, product, quotient, and chain rules; computes definite and</tspan>
      <tspan x="24" dy="20">indefinite integrals with proper integration constant (+ C).</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">diff(x^3 * sin(x), x)  ⟶  3x^2*sin(x) + x^3*cos(x)</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">integral(x^3, x)  ⟶  (1/4)x^4 + C</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">int(cos(2x), x)  ⟶  (1/2)sin(2x) + C</text>
  </g>

  <!-- CARD 6: Exact Arithmetic & Scientific Evaluation -->
  <g transform="translate(1290, 580)">
    <rect width="550" height="400" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="550" height="6" rx="3" fill="#D97736"/>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#1E231D">Exact Arithmetic &amp; Scientific Functions</text>
    <rect x="24" y="58" width="80" height="24" rx="6" fill="#EBF2EC"/>
    <text x="32" y="74" font-size="11" font-weight="700" fill="#266B3F">Arithmetic</text>
    <rect x="115" y="58" width="180" height="24" rx="6" fill="#EEF2F8"/>
    <text x="123" y="74" font-size="11" font-weight="700" fill="#2C579B">Exact BigInt Rational Engine</text>
    <text x="24" y="112" font-size="13" fill="#5F675D">
      <tspan x="24" dy="0">Lossless rational fraction arithmetic. Supports square roots, absolute</tspan>
      <tspan x="24" dy="20">values (|x|), large integer factorials (n!), percentages (%), logarithms</tspan>
      <tspan x="24" dy="20">(log, ln), and trigonometry (sin, cos, tan) with exact forms.</tspan>
    </text>
    <rect x="20" y="185" width="510" height="195" rx="8" fill="#F7F5F0" stroke="#E2DED6"/>
    <text x="32" y="210" font-size="11" font-weight="700" fill="#8A857A" letter-spacing="1">CANONICAL WORKED EXAMPLES</text>
    <circle cx="36" cy="240" r="3.5" fill="#D97736"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">1/3 + 1/6  ⟶  1/2 (Exact Lossless Rational)</text>
    <circle cx="36" cy="285" r="3.5" fill="#D97736"/>
    <text x="48" y="289" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">sqrt(100) + 5! / 2  ⟶  10 + 60 = 70</text>
    <circle cx="36" cy="330" r="3.5" fill="#D97736"/>
    <text x="48" y="334" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1E231D">sin(0) + cos(0)*10 + log(100)  ⟶  12</text>
  </g>

  <!-- Footer -->
  <text x="80" y="1030" font-size="13" fill="#5F675D">* All solutions generate step-by-step pedagogical derivations, formatted LaTeX proofs, and automated residual verification (|LHS - RHS| &lt; 10⁻⁹).</text>
</svg>